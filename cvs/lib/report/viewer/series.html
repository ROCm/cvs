<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>__TITLE__</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<style>
:root {
  --bg: #0f1117; --panel: #1a1d27; --border: #2a2f3d; --text: #e8eaef; --muted: #9aa3b5;
  --accent: #ff6b35; --accent2: #6b9fff;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif;
  background: linear-gradient(160deg, #0a0c12 0%, #12151f 40%, #0f1117 100%);
  color: var(--text); line-height: 1.45; padding: 1.25rem; }
.wrap { max-width: 1140px; margin: 0 auto; }
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
.hero { margin-bottom: 1rem; }
h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
.subtitle { color: var(--muted); margin: 0; font-size: 0.95rem; }
.viewer-nav { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.75rem 0 1rem; padding: 0.65rem 1rem;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; font-size: 0.8rem; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 1rem 1.25rem; margin-bottom: 1rem; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
.panel h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  margin: 0 0 0.85rem; font-weight: 600; }
.meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem 1rem; }
.meta-item { display: flex; flex-direction: column; gap: 0.15rem; }
.meta-k { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.meta-v { font-size: 0.9rem; font-weight: 500; word-break: break-word; }
.notes { font-size: 0.85rem; color: var(--muted); margin-top: 0.75rem; }
.muted { color: var(--muted); font-size: 0.85rem; }
.chart-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
  margin-bottom: 0.5rem; }
.chart-hint { font-size: 0.72rem; color: var(--muted); }
.chart-toolbar button { background: #12151f; color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.8rem; }
.chart-toolbar button:hover { border-color: var(--accent); }
.chart-canvas-wrap { position: relative; height: 340px; }
.results-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--border); text-align: left; }
th { color: var(--muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; }
.rd-pager { display: flex; align-items: center; justify-content: flex-end; gap: 0.75rem;
  margin-top: 0.75rem; font-size: 0.8rem; color: var(--muted); }
.rd-pager button { background: #12151f; color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.3rem 0.7rem; cursor: pointer; }
.rd-pager button:hover { border-color: var(--accent); }
footer.page-foot { text-align: center; margin-top: 2rem; }
.to-top { display: block; width: max-content; margin: 0.85rem auto 0; padding: 0.3rem 0.75rem;
  border: 1px solid var(--border); border-radius: 6px; background: #12151f; color: var(--accent2);
  text-decoration: none; font-size: 0.8rem; }
.to-top:hover { border-color: var(--accent); }
#load-error { color: #ff5c6a; }
</style>
</head>
<body data-viewer="series">
<div class="wrap" id="top">
<header class="hero">
  <h1>__TITLE__</h1>
  <p class="subtitle">__SUBTITLE__</p>
</header>
<nav class="viewer-nav" id="deck-nav" hidden></nav>
<div id="load-error" hidden></div>
<div id="deck-sections"></div>
<footer class="page-foot"><a class="to-top" href="#top">Go to top</a></footer>
</div>
__EMBEDDED_JSON__
<script>
'use strict';
const JSON_PATH = __JSON_PATH__;

const LINE_DASHES = [[], [8, 4], [2, 3], [12, 4, 3, 4]];
const LINE_POINT_STYLES = ['circle', 'rect', 'triangle', 'rectRot'];
const CHART_COLORS = [
  '#ff6b35', '#6b9fff', '#c77dff', '#3dd68c', '#f0c040', '#ff5c6a',
  '#2ec4b6', '#e879f9', '#a3e635', '#818cf8', '#22d3ee', '#f472b6',
];
const chartInstances = [];

function esc(text) {
  return String(text == null ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtNum(value) {
  const num = Number(value);
  if (!Number.isFinite(num)) return String(value == null ? '—' : value);
  const abs = Math.abs(num);
  if (abs >= 1000) return num.toFixed(1);
  if (abs >= 10) return num.toFixed(2);
  return num.toFixed(3);
}

function resolveBind(context, bind) {
  if (!bind) return undefined;
  if (bind.indexOf('.') < 0) return context ? context[bind] : undefined;
  return bind.split('.').reduce((obj, key) => (obj != null ? obj[key] : undefined), context);
}

function lineStyle(index) {
  return {
    color: CHART_COLORS[index % CHART_COLORS.length],
    // A repeated color gets the next dash, so line 13 is not the same mark as line 1.
    dash: LINE_DASHES[Math.floor(index / CHART_COLORS.length) % LINE_DASHES.length],
    point: LINE_POINT_STYLES[index % LINE_POINT_STYLES.length],
  };
}

function lineLegendLabels() {
  return {
    color: '#e8eaef',
    usePointStyle: true,
    pointStyle: 'line',
    boxWidth: 28,
    boxHeight: 6,
    font: { size: 11 },
  };
}

function buildLineDataset(label, data, index) {
  const style = lineStyle(index);
  return {
    label,
    data,
    borderColor: style.color,
    backgroundColor: style.color,
    borderWidth: 2.5,
    borderDash: style.dash,
    tension: 0.2,
    fill: false,
    pointRadius: 5,
    pointHoverRadius: 7,
    pointStyle: style.point,
    pointBackgroundColor: style.color,
    pointBorderColor: '#1a1d27',
    pointBorderWidth: 2,
    spanGaps: true,
    // Dashed / alternate styles draw on top so overlapping trends stay visible.
    order: style.dash.length ? index : index + 10,
  };
}

function collectLineEntries(data, yField) {
  const raw = ((data && data.charts) || {})[yField];
  const entries = [];
  if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
    Object.values(raw).forEach(seriesList => {
      if (Array.isArray(seriesList)) entries.push(...seriesList);
      else if (seriesList && typeof seriesList === 'object') entries.push(seriesList);
    });
  } else if (Array.isArray(raw)) {
    entries.push(...raw);
  }
  return entries.filter(entry => entry && typeof entry === 'object');
}

// Merge x labels so every series keeps its own order even when collectives sweep different sizes.
function unionLabels(entries) {
  const out = [];
  entries.forEach(entry => {
    let at = -1;
    (entry.points || []).forEach(point => {
      const label = String(point[0]);
      const found = out.indexOf(label);
      if (found >= 0) {
        at = found;
        return;
      }
      at += 1;
      out.splice(at, 0, label);
    });
  });
  return out;
}

function makeLineChart(canvas, labels, datasets, unit) {
  const chart = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', axis: 'x', intersect: false },
      plugins: {
        legend: { labels: lineLegendLabels() },
        tooltip: {
          backgroundColor: '#2a3142',
          borderColor: '#3a4255',
          borderWidth: 1,
          titleColor: '#e8eaef',
          bodyColor: '#c8d0e0',
          callbacks: {
            label: ctx => ctx.dataset.label + ': ' + fmtNum(ctx.parsed.y) + (unit ? ' ' + unit : ''),
          },
        },
        zoom: {
          pan: { enabled: true, mode: 'x' },
          zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' },
        },
      },
      scales: {
        x: { ticks: { color: '#9aa3b5', maxRotation: 0 }, grid: { color: '#2a2f3d' } },
        y: {
          ticks: { color: '#9aa3b5' },
          grid: { color: '#2a2f3d' },
          title: unit ? { display: true, text: unit, color: '#9aa3b5', font: { size: 11 } } : undefined,
        },
      },
    },
  });
  chartInstances.push(chart);
  return chart;
}

function linkOrText(value) {
  const text = String(value == null ? '—' : value);
  try {
    const url = new URL(text, document.baseURI);
    if (['http:', 'https:', 'file:'].includes(url.protocol)) {
      return `<a href='${esc(text)}'>${esc(text)}</a>`;
    }
  } catch (_err) { /* not a navigable URL */ }
  return esc(text);
}

function renderRunCard(payload, data) {
  const rows = Array.isArray(data) ? data : (payload.run_card_display || []);
  const items = rows.map(row => {
    const inner = row[2] ? linkOrText(row[1]) : esc(row[1] == null ? '—' : row[1]);
    return `<div class='meta-item'><span class='meta-k'>${esc(row[0])}</span><span class='meta-v'>${inner}</span></div>`;
  }).join('');
  const notes = payload.run_card_notes ? `<p class='notes'>${esc(payload.run_card_notes)}</p>` : '';
  return `<div class='meta-grid'>${items}</div>${notes}`;
}

function renderLineChartShell(card, data, sectionId) {
  const yField = (card.series || {}).y_field;
  if (!collectLineEntries(data, yField).length) return "<p class='muted'>No series data.</p>";
  return `<div class='chart-toolbar'>`
    + `<span class='chart-hint'>Scroll to zoom · drag to pan · x axis</span>`
    + `<button type='button' data-reset-zoom='${esc(sectionId)}'>Reset zoom</button></div>`
    + `<div class='chart-canvas-wrap'><canvas id='chart-${esc(sectionId)}'></canvas></div>`;
}

function drawLineChart(card, data, sectionId) {
  const seriesCfg = card.series || {};
  const entries = collectLineEntries(data, seriesCfg.y_field)
    .sort((a, b) => String(a.label || '').localeCompare(String(b.label || '')));
  const canvas = document.getElementById('chart-' + sectionId);
  if (!canvas || !entries.length) return;
  if (typeof Chart === 'undefined') {
    canvas.parentNode.innerHTML = "<p class='muted'>Chart.js could not be loaded; see the results table below.</p>";
    return;
  }
  const labels = unionLabels(entries);
  const datasets = entries.map((entry, index) => {
    const byLabel = {};
    (entry.points || []).forEach(point => { byLabel[String(point[0])] = point[1]; });
    const values = labels.map(label => (label in byLabel ? Number(byLabel[label]) : null));
    return buildLineDataset(String(entry.label || card.title || seriesCfg.y_field), values, index);
  });
  makeLineChart(canvas, labels, datasets, seriesCfg.unit || '');
}

function renderResultsTable(data) {
  const table = data && typeof data === 'object' ? data : {};
  const headers = table.headers || [];
  const rows = table.rows || [];
  if (!headers.length) return "<p class='muted'>No results table rows.</p>";
  const head = `<tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr>`;
  const body = rows.map(row =>
    `<tr>${row.map(cell => `<td>${esc(cell == null ? '—' : cell)}</td>`).join('')}</tr>`
  ).join('');
  return `<table class='results-table'><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function cardSectionId(card) {
  return card.id || String(card.type).replace(/_/g, '-');
}

function renderCard(payload, card) {
  const bind = card.bind || card.type;
  const data = bind.indexOf('.') >= 0 ? resolveBind(payload, bind) : payload[bind];
  const sectionId = cardSectionId(card);
  const title = card.title || sectionId.replace(/-/g, ' ');
  let body = '';
  if (card.type === 'run_card') body = renderRunCard(payload, data);
  else if (card.type === 'line_chart') body = renderLineChartShell(card, data, sectionId);
  else if (card.type === 'table') body = `<div class='results-wrap'>${renderResultsTable(data)}</div>`;
  else body = `<p class='muted'>Unsupported card type: ${esc(card.type)}</p>`;
  return `<section class='panel' id='${esc(sectionId)}'><h2>${esc(title)}</h2>${body}</section>`;
}

function renderSeriesDeck(payload) {
  const cards = (payload.deck_profile || {}).cards || [];
  const nav = document.getElementById('deck-nav');
  document.getElementById('deck-sections').innerHTML = cards.map(card => renderCard(payload, card)).join('');
  const links = cards.map(card => {
    const sectionId = cardSectionId(card);
    return `<a href='#${esc(sectionId)}'>${esc(card.title || sectionId)}</a>`;
  });
  if (links.length) {
    nav.innerHTML = links.join('');
    nav.hidden = false;
  }
  cards.filter(card => card.type === 'line_chart').forEach(card => {
    const bind = card.bind || card.type;
    drawLineChart(card, resolveBind(payload, bind), cardSectionId(card));
  });
  document.getElementById('deck-sections').addEventListener('click', event => {
    const button = event.target.closest('button[data-reset-zoom]');
    if (!button) return;
    const chart = chartInstances.find(c => c.canvas.id === 'chart-' + button.getAttribute('data-reset-zoom'));
    if (chart && chart.resetZoom) chart.resetZoom();
  });
  pageLongTables(document);
}

function loadReportData() {
  const embedded = document.getElementById('embedded-report-json');
  if (embedded && embedded.textContent.trim()) {
    return Promise.resolve(JSON.parse(embedded.textContent));
  }
  return fetch(JSON_PATH).then(response => {
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    return response.json();
  });
}

__PAGE_TABLES_JS__

loadReportData().then(payload => {
  renderSeriesDeck(payload);
}).catch(err => {
  const box = document.getElementById('load-error');
  box.hidden = false;
  box.textContent = 'Failed to load report JSON: ' + err.message;
});
</script>
</body>
