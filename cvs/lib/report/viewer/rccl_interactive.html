<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>__TITLE__</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<style>
:root {
  --bg: #0f1117; --panel: #1a1d27; --border: #2a2f3d;
  --text: #e8eaef; --muted: #9aa3b5; --accent: #ff6b35; --link: #6b9fff;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 1.25rem; color: var(--text); line-height: 1.45;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: linear-gradient(160deg, #0a0c12, #12151f 40%, var(--bg));
}
main { max-width: 1250px; margin: auto; }
header { margin-bottom: 1rem; }
h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.02em; }
.subtitle, .hint, .count { color: var(--muted); }
.subtitle { margin: 0.2rem 0 0; }
a { color: var(--link); }
nav { display: flex; gap: 1rem; margin-top: 0.75rem; font-size: 0.85rem; }
.panel {
  margin: 1rem 0; padding: 1rem 1.25rem; border: 1px solid var(--border);
  border-radius: 12px; background: var(--panel); box-shadow: 0 8px 32px #0004;
}
h2 { margin: 0 0 0.8rem; font-size: 1rem; }
.run-card { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0.6rem; }
.run-item { padding: 0.7rem; border: 1px solid var(--border); border-radius: 8px; background: #ffffff06; }
.run-item dt { font-size: 0.72rem; color: var(--muted); }
.run-item dd { margin: 0.2rem 0 0; overflow-wrap: anywhere; }
.chart-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
.chart-head h2 { margin: 0; }
.chart-wrap { position: relative; height: 330px; margin-top: 0.75rem; }
button, input {
  padding: 0.4rem 0.65rem; border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); background: #12151f; font: inherit;
}
button { cursor: pointer; }
button:hover, button:focus-visible { border-color: var(--accent); }
.hint { margin: 0.35rem 0 0; font-size: 0.78rem; }
.table-head { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 0.75rem; }
.table-head label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.8rem; }
.table-head input { min-width: min(20rem, 75vw); }
.count { margin: 0.7rem 0; font-size: 0.8rem; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--border); text-align: left; }
th { white-space: nowrap; }
th button { border: 0; padding: 0; background: none; font-weight: 600; }
th button:hover, th button:focus-visible { color: var(--accent); }
tbody tr:hover { background: #ffffff09; }
@media (max-width: 640px) { .chart-wrap { height: 270px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>__TITLE__</h1>
    <p class="subtitle">__SUBTITLE__</p>
    <nav><a id="run-deck-link">Run Deck</a><a id="json-link">JSON data</a></nav>
  </header>
  <p id="status" role="status"></p>
  <section class="panel" aria-labelledby="run-card-title">
    <h2 id="run-card-title">Run card</h2>
    <dl id="run-card" class="run-card"></dl>
  </section>
  <div id="charts"></div>
  <section class="panel" aria-labelledby="results-title">
    <div class="table-head">
      <h2 id="results-title">Full results</h2>
      <label>Filter results<input id="table-filter" type="search" placeholder="Search any column"/></label>
    </div>
    <p id="row-count" class="count"></p>
    <div class="table-wrap"><table id="results-table"><thead></thead><tbody></tbody></table></div>
  </section>
</main>
__EMBEDDED_JSON__
<script>
'use strict';
const JSON_PATH = __JSON_PATH__;
const metricLabels = {
  bus_bw: ['Bus bandwidth vs message size', 'GB/s'],
  alg_bw: ['Algorithm bandwidth vs message size', 'GB/s'],
  time: ['Time vs message size', 'us'],
};
const colors = ['#ff6b35', '#6b9fff', '#c77dff', '#3dd68c', '#ffd166', '#ff6b9a', '#66d9e8'];
const byId = id => document.getElementById(id);

function loadReportData() {
  const embedded = byId('embedded-report-json');
  if (embedded && embedded.textContent.trim()) {
    return Promise.resolve(JSON.parse(embedded.textContent));
  }
  return fetch(JSON_PATH).then(response => {
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    return response.json();
  });
}

function renderRunCard(rows) {
  const card = byId('run-card');
  for (const [label, value, isLink] of rows || []) {
    const item = document.createElement('div');
    item.className = 'run-item';
    const term = document.createElement('dt');
    term.textContent = label;
    const detail = document.createElement('dd');
    const url = isLink ? new URL(String(value), document.baseURI) : null;
    if (url && ['http:', 'https:', 'file:'].includes(url.protocol)) {
      const link = document.createElement('a');
      link.href = value;
      link.textContent = value;
      detail.append(link);
    } else {
      detail.textContent = value == null ? '—' : String(value);
    }
    item.append(term, detail);
    card.append(item);
  }
}

function sizeNumber(label) {
  const match = String(label).match(/^(\d+(?:\.\d+)?)([KMG]?)$/i);
  if (!match) return null;
  return Number(match[1]) * (1024 ** ({'': 0, K: 1, M: 2, G: 3}[match[2].toUpperCase()]));
}

function renderCharts(series) {
  const charts = series.charts || {};
  const fields = series.y_fields || Object.keys(charts);
  for (const field of fields) {
    const groups = charts[field] || {};
    const lines = Object.entries(groups).flatMap(([collective, entries]) =>
      (entries || []).map(entry => ({ label: entry.label || collective, points: entry.points || [] }))
    );
    const labels = [...new Set(lines.flatMap(line => line.points.map(point => String(point[0]))))];
    labels.sort((a, b) => {
      const left = sizeNumber(a);
      const right = sizeNumber(b);
      return left !== null && right !== null ? left - right : a.localeCompare(b, undefined, { numeric: true });
    });
    const [title, unit] = metricLabels[field] || [field, ''];
    const panel = document.createElement('section');
    panel.className = 'panel';
    const head = document.createElement('div');
    head.className = 'chart-head';
    const heading = document.createElement('h2');
    heading.textContent = title;
    const reset = document.createElement('button');
    reset.type = 'button';
    reset.textContent = 'Reset zoom';
    head.append(heading, reset);
    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = 'Wheel to zoom · drag to pan · double-click to reset';
    const wrap = document.createElement('div');
    wrap.className = 'chart-wrap';
    const canvas = document.createElement('canvas');
    canvas.setAttribute('aria-label', title);
    canvas.setAttribute('role', 'img');
    wrap.append(canvas);
    panel.append(head, hint, wrap);
    byId('charts').append(panel);
    if (!labels.length) {
      wrap.textContent = 'No results for this metric.';
      reset.hidden = true;
      continue;
    }
    const datasets = lines.map((line, index) => {
      const values = new Map(line.points.map(([x, y]) => [String(x), Number(y)]));
      const color = colors[index % colors.length];
      return {
        label: line.label, data: labels.map(label => values.get(label) ?? null),
        borderColor: color, backgroundColor: color, borderWidth: 2,
        pointRadius: 3, tension: 0.15, spanGaps: false,
      };
    });
    const chart = new Chart(canvas, {
      type: 'line', data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', axis: 'x', intersect: false },
        plugins: {
          legend: { labels: { color: '#e8eaef', boxWidth: 12 } },
          zoom: {
            pan: { enabled: true, mode: 'x' },
            zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' },
          },
        },
        scales: {
          x: { title: { display: true, text: 'Message size', color: '#9aa3b5' }, ticks: { color: '#9aa3b5' }, grid: { color: '#2a2f3d' } },
          y: { title: { display: !!unit, text: unit, color: '#9aa3b5' }, ticks: { color: '#9aa3b5' }, grid: { color: '#2a2f3d' } },
        },
      },
    });
    reset.addEventListener('click', () => chart.resetZoom());
    canvas.addEventListener('dblclick', () => chart.resetZoom());
    if (typeof Hammer === 'undefined') {
      let lastX = null;
      canvas.style.cursor = 'grab';
      canvas.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        lastX = event.clientX;
        canvas.style.cursor = 'grabbing';
      });
      window.addEventListener('pointermove', event => {
        if (lastX === null) return;
        chart.pan({ x: event.clientX - lastX, y: 0 }, undefined, 'none');
        lastX = event.clientX;
      });
      const stopPan = () => {
        lastX = null;
        canvas.style.cursor = 'grab';
      };
      window.addEventListener('pointerup', stopPan);
      window.addEventListener('pointercancel', stopPan);
      window.addEventListener('blur', stopPan);
    }
  }
}

function renderTable(table) {
  const headers = table.headers || [];
  const rows = table.rows || [];
  const head = byId('results-table').tHead;
  const body = byId('results-table').tBodies[0];
  const filter = byId('table-filter');
  let sortColumn = -1;
  let ascending = true;
  const headerRow = head.insertRow();
  const cells = headers.map((label, index) => {
    const cell = document.createElement('th');
    cell.scope = 'col';
    cell.setAttribute('aria-sort', 'none');
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', () => {
      ascending = sortColumn === index ? !ascending : true;
      sortColumn = index;
      cells.forEach((other, i) => other.setAttribute('aria-sort', i === index ? (ascending ? 'ascending' : 'descending') : 'none'));
      update();
    });
    cell.append(button);
    headerRow.append(cell);
    return cell;
  });
  function update() {
    const query = filter.value.trim().toLocaleLowerCase();
    const visible = rows.filter(row => row.some(value => String(value ?? '').toLocaleLowerCase().includes(query)));
    if (sortColumn >= 0) {
      visible.sort((left, right) => {
        const a = left[sortColumn];
        const b = right[sortColumn];
        const numeric = Number(a) - Number(b);
        const comparison = Number.isFinite(numeric) && a !== '' && b !== ''
          ? numeric : String(a ?? '').localeCompare(String(b ?? ''), undefined, { numeric: true });
        return ascending ? comparison : -comparison;
      });
    }
    body.replaceChildren();
    const fragment = document.createDocumentFragment();
    for (const row of visible) {
      const tr = document.createElement('tr');
      for (const value of row) {
        const td = document.createElement('td');
        td.textContent = value == null ? '—' : String(value);
        tr.append(td);
      }
      fragment.append(tr);
    }
    body.append(fragment);
    byId('row-count').textContent = `${visible.length} of ${rows.length} rows`;
  }
  filter.addEventListener('input', update);
  update();
}

byId('json-link').href = JSON_PATH;
byId('run-deck-link').href = JSON_PATH.replace(/\.json$/i, '.html');
loadReportData().then(data => {
  renderRunCard(data.run_card_display);
  if (typeof Chart === 'undefined') {
    byId('status').textContent = 'Chart.js could not load. Connect to the CDN to view charts.';
  } else {
    renderCharts((data.datasets || {}).series || {});
  }
  renderTable(data.results_table || {});
}).catch(error => {
  byId('status').textContent = `Could not load report data: ${error.message}`;
});
</script>
</body>
</html>
