name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['**']
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.10'
        
    - name: Run make test
      run: make test
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results
        path: |
          *.log
          .coverage
        retention-days: 2

  container-smoke:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build CVS container image
      run: docker build --tag cvs:ci .

    - name: Verify container entrypoint and packaged configuration
      run: |
        docker run --rm cvs:ci --version
        docker run --rm cvs:ci copy-config --list
        docker run --rm --entrypoint /bin/sh cvs:ci -c 'command -v ssh && command -v ip'
