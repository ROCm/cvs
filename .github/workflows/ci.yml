name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['**']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: cvs/monitors/cluster-mon/go.mod
        cache-dependency-path: cvs/monitors/cluster-mon/go.sum

    - name: Run make test
      run: make test
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results
        path: |
          *.log
          .coverage
        retention-days: 2

  container-smoke:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build CVS container image
      run: docker build --tag cvs:ci .

    - name: Verify container entrypoint and packaged configuration
      run: |
        docker run --rm cvs:ci --version
        docker run --rm cvs:ci copy-config --list
        docker run --rm --entrypoint /bin/sh cvs:ci -c 'command -v ssh && command -v ip'
